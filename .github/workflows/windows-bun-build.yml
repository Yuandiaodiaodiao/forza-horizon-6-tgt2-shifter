name: Windows Bun Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare build metadata
        id: meta
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $stamp = Get-Date -AsUTC -Format "yyyyMMdd-HHmmss"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $tag = "pr-${{ github.event.number }}-$shortSha"
          } else {
            $tag = "build-$stamp-$shortSha"
          }
          $buildTime = Get-Date -AsUTC -Format "o"
          @(
            "export const BUILD_TAG = `"$tag`";"
            "export const BUILD_SHA = `"${{ github.sha }}`";"
            "export const BUILD_TIME = `"$buildTime`";"
            "export const UPDATE_REPO = `"${{ github.repository }}`";"
          ) | Set-Content -Path src/build_info.ts -Encoding utf8
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build Windows artifact
        run: bun run build:win

      - name: Copy versioned artifact
        shell: pwsh
        run: |
          Copy-Item dist/tgt2-telemetry.exe "dist/tgt2-telemetry-${{ steps.meta.outputs.tag }}.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgt2-telemetry-windows
          path: dist/tgt2-telemetry-${{ steps.meta.outputs.tag }}.exe
          if-no-files-found: error

      - name: Create git tag
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.meta.outputs.tag }}" "${{ github.sha }}"
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: Publish release asset
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: dist/tgt2-telemetry-${{ steps.meta.outputs.tag }}.exe
          make_latest: true
